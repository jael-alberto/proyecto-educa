<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Educa - Crear cuenta</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav>
        <span class="logo">🎓 Educa</span>
        <a href="index.html">Inicio</a>
        <a href="cursos.html">Cursos</a>
        <a href="login.html">Iniciar sesion</a>
    </nav>

    <section class="hero" style="padding:70px 24px">
        <h1 style="font-size:2.4rem">Crea tu cuenta gratis</h1>
        <p>Unete a mas de 12,000 estudiantes y empieza hoy</p>
    </section>

    <main class="container" style="padding-top:0; margin-top:-40px">
        <form id="formRegistro">
            <h2>🚀 Registrarse</h2>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required>
            <label for="correo">Correo electronico</label>
            <input type="email" id="correo" placeholder="tu@correo.com" required>
            <label for="clave">Contrasena</label>
            <input type="password" id="clave" placeholder="Crea una contrasena" required>
            <label for="confirmar">Confirmar contrasena</label>
            <input type="password" id="confirmar" placeholder="Repite tu contrasena" required>
            <button class="btn btn-verde" type="submit">Crear mi cuenta</button>
            <p style="text-align:center; margin-top:18px">Ya tienes cuenta? <a href="login.html" style="color:var(--azul); font-weight:600">Inicia sesion</a></p>
        </form>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('formRegistro').addEventListener('submit', function (e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const clave = document.getElementById('clave').value;
            const confirmar = document.getElementById('confirmar').value;
            if (clave !== confirmar) {
                alert('Las contrasenas no coinciden. Intentalo de nuevo.');
                return;
            }
            localStorage.setItem('usuarioEduca', JSON.stringify({ nombre: nombre, correo: correo }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
