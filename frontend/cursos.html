<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de cursos | Sistema Educa</title>
    <meta name="description" content="Explora los cursos disponibles por modalidad y nivel de dificultad.">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav aria-label="Navegacion principal">
        <a class="logo" href="index.html">Educa</a>
        <a href="index.html">Inicio</a>
        <a href="cursos.html" aria-current="page">Cursos</a>
        <div class="nav-sesion" data-zona-sesion></div>
    </nav>

    <main class="container" id="contenido">
        <header class="cabecera-pagina">
            <h1>Catalogo de cursos</h1>
            <p>
                Puedes ver el catalogo sin iniciar sesion. Solo necesitas entrar
                cuando quieras postularte a un grupo.
            </p>
        </header>

        <form class="filtros" id="formFiltros" aria-label="Filtrar cursos">
            <div class="campo">
                <label for="dificultad">Nivel</label>
                <select id="dificultad" name="dificultad">
                    <option value="">Todos los niveles</option>
                    <option value="principiante">Principiante</option>
                    <option value="intermedio">Intermedio</option>
                    <option value="avanzado">Avanzado</option>
                </select>
            </div>

            <div class="campo">
                <label for="modalidad">Modalidad</label>
                <select id="modalidad" name="modalidad">
                    <option value="">Todas las modalidades</option>
                    <option value="presencial">Presencial</option>
                    <option value="hibrida">Hibrida</option>
                    <option value="online">Online</option>
                    <option value="online_en_vivo">Online en vivo</option>
                </select>
            </div>

            <div class="campo campo-boton">
                <button class="btn btn-primario" type="submit">Aplicar filtros</button>
                <button class="btn btn-outline" type="reset">Limpiar</button>
            </div>
        </form>

        <p class="resultados" id="resultados" role="status" aria-live="polite">Cargando cursos...</p>

        <div class="rejilla-cursos" id="listaCursos" aria-busy="true"></div>

        <p class="vacio" id="sinResultados" hidden>
            No hay cursos que coincidan con esos filtros.
            <button class="enlace-boton" type="button" id="quitarFiltros">Ver todos los cursos</button>
        </p>
    </main>

    <script type="module" src="js/cursos.js"></script>
</body>
</html>
