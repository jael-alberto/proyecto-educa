<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Educa - Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav>
        <span class="logo">🎓 Educa</span>
        <a href="index.html">Inicio</a>
        <a href="login.html">Login</a>
        <a href="registro.html">Registro</a>
        <a href="cursos.html">Cursos</a>
    </nav>

    <form id="formRegistro">
        <h2>Registrarse</h2>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>
        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="tu@correo.com" required>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" placeholder="Crea una contraseña" required>
        <button type="submit">Registrarse</button>
        <p style="text-align:center; margin-top:15px">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </form>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            localStorage.setItem('usuarioEduca', JSON.stringify({ nombre: nombre, correo: correo }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
